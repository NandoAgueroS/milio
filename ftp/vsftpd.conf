# vsftpd configuration for a single writable account mapped onto the webroot.
# Address, port range and root are rewritten from the environment at startup.

listen=YES
listen_ipv6=NO
background=NO

# No anonymous access: only the account created by the entrypoint can log in.
anonymous_enable=NO
local_enable=YES
write_enable=YES
# 002: uploads land 664 (files) / 775 (dirs), i.e. writable by the web server's
# group. 022 would make them read-only for it and force a 0777 workaround.
local_umask=002
file_open_mode=0666

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_std_format=YES
connect_from_port_20=YES
ls_recurse_enable=YES

# Jail every session inside local_root, which is the shared webroot. The jail
# directory is writable, so allow_writeable_chroot is required for uploads.
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
local_root=/var/www/html

pam_service_name=vsftpd
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Passive mode: the client learns the address to reconnect to from the server,
# so pasv_address must be an address the client can actually reach.
pasv_enable=YES
pasv_address=127.0.0.1
pasv_addr_resolve=NO
pasv_min_port=21000
pasv_max_port=21010
