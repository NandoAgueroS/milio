# Development defaults: verbose errors, generous upload limits, and an OPcache
# that notices the file an FTP client just replaced.
ServerName localhost

# The host publishes this container as 127.0.0.1:8080, but inside the container
# 127.0.0.1 is the container itself. Server-side calls between the apps (OIDC
# discovery, token, JWKS) use the same public URL as the browser, so Apache has
# to answer on 8080 here too. The published mapping stays 8080 -> 80.
Listen 8080

<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
