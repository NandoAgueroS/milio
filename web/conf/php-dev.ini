; Development overrides mounted at /usr/local/etc/php/conf.d/zz-dev.ini
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; FTP replaces whole files, so the cache must not hold a stale timestamp.
; revalidate_freq=0 makes every request stat the file again.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

date.timezone = UTC
